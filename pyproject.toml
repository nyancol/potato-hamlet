[project]
name = "potato-hamlet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yann", email = "yann@patates.club" }
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
    "rdflib>=7.6.0",
    "textual>=3.0.0",
]

[project.scripts]
potato-hamlet = "tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime", "tui"]
