case: requisitions
ontology: ontology.ttl
population: population.ttl
oracle: oracle
time:
  deadline_day: 14
  deadline_hour: 18
ecas:
- id: lodge
  eca_process: LodgeRequisition
  mints: Requisition
  holder_role: RequisitionerRole
  params:
  - name: citizen
    role: RequisitionerRole
    source: selected
  label: Lodge a requisition
  message: '{citizen} may lodge one requisition at a time'
  modality: may
- id: withdraw
  eca_process: WithdrawRequisition
  holder_role: RequisitionerRole
  params:
  - name: citizen
    role: RequisitionerRole
    source: selected
  label: Withdraw a requisition
  message: '{citizen} may withdraw their own open requisition'
  modality: may
- id: settle
  eca_process: SettleRequisition
  holder_role: OfficerRole
  params:
  - name: requisition
    role: RequisitionerRole
    source: choices
  - name: decision
    role: OfficerRole
    source: choices
  - name: officer
    role: OfficerRole
    source: selected
  label: Settle a requisition
  message: '{officer} must approve or refuse {requisition} by the deadline'
  modality: must
readings:
- id: openRequisitions
  class: null
  label: Requisitions awaiting decision
  template: '{value} open'
- id: approvedTotal
  class: null
  label: Approved purchases
  template: '{value} approved'
- id: lastSettled
  class: Requisition
  label: Last settled requisition
  template: '{label}'
freeze: sha256:061924a483b987a86282bcaa2bd3eba8a37251bfcadaf897be19066a54e60507
shared_vocabulary: sha256:a5e498bafb67f5a83abd100d0b8250ef460f83a44dfb06b9976fb76f5675a364
world: sha256:f302a813abba5df7ec3ab0ee4ef7afa6a5a1b8a62a436bce70a17c04c42c276f
