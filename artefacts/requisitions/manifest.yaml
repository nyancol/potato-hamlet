case: requisitions
ontology: ontology.ttl
population: population.ttl
oracle: oracle
time:
  deadline_day: 14
  deadline_hour: 18
ecas:
- id: lodge
  eca_process: LodgeRequisition
  # This act creates a new ongoing instance of ph:Requisition. Declared, so
  # starting a process is distinguishable in the artefacts from any other act,
  # and so a class whose every instance is minted is still visibly reachable.
  mints: Requisition
  holder_role: RequisitionerRole
  params:
  - name: citizen
    role: RequisitionerRole
    source: selected
  label: Lodge a requisition
  message: '{citizen} may lodge one requisition at a time'
  modality: may
- id: withdraw
  eca_process: WithdrawRequisition
  holder_role: RequisitionerRole
  params:
  - name: citizen
    role: RequisitionerRole
    source: selected
  label: Withdraw a requisition
  message: '{citizen} may withdraw their own open requisition'
  modality: may
- id: settle
  eca_process: SettleRequisition
  holder_role: OfficerRole
  params:
  # The instance this duty acts in. Several requisitions are open at once, so
  # the consumer presents the open instances as a choice and the act names the
  # one selected; a name the law does not recognise is refused by a guard.
  - name: requisition
    role: RequisitionerRole
    source: choices
  - name: officer
    role: OfficerRole
    source: selected
  label: Settle a requisition
  message: '{officer} must approve or refuse {requisition} by the deadline'
  modality: must

# Every reading the oracle can emit, with the class a `ref` reading resolves
# through and the template a consumer renders it with.
readings:
- id: openRequisitions
  class: null
  label: Requisitions awaiting decision
  template: "{value} open"
- id: approvedTotal
  class: null
  label: Approved purchases
  template: "{value} approved"
- id: lastSettled
  class: Requisition
  label: Last settled requisition
  template: "{label}"
