case: mayor-quorum
freeze: sha256:c6a48f34059d3d5eeaa6cd80164fc531cbcb43f440e00b2c82ce0919b5c130b6
ontology: ontology.ttl
population: population.ttl
oracle: oracle
time:
  cycle_days: 1461
  announce_minus: 10
  prepare_minus: 1
  polls_open: 9
  polls_close: 19
  quorum_repeat_gap_days: 30
ecas:
- id: announce
  eca_process: AnnounceElection
  holder_role: MayorRole
  params: []
  label: Announce election
  message: '{holder} should announce candidacy opening'
  modality: should
- id: nominate
  eca_process: SelfNomination
  holder_role: CandidateRole
  params:
  - name: citizen
    role: VoterRole
    source: selected
  label: Nominate self
  message: '{citizen} may nominate before the registry closes'
  modality: may
- id: prepare
  eca_process: CreateBallots
  holder_role: MayorRole
  params: []
  label: Create and distribute ballots
  message: '{holder} must create and distribute ballots'
  modality: must
- id: vote
  eca_process: CastVote
  holder_role: VoterRole
  params:
  - name: voter
    role: VoterRole
    source: selected
  - name: candidate
    role: CandidateRole
    source: choices
  label: Cast vote
  message: '{citizen} should cast one vote 9am-7pm'
  modality: should
- id: count
  eca_process: CountVotes
  holder_role: MayorRole
  params: []
  label: Count votes
  message: '{holder} must count votes and post results'
  modality: must
- id: proclaim
  eca_process: ProclaimMayor
  holder_role: MayorRole
  params: []
  label: Proclaim mayor
  message: '{holder} must proclaim the winner (oldest on tie)'
  modality: must
- id: repeat
  eca_process: ScheduleRepeatElection
  holder_role: MayorRole
  params: []
  label: Schedule repeat election
  message: '{holder} must schedule a repeat election 30 days later with a fresh registry'
  modality: must

# Every reading the oracle can emit, with the class a `ref` reading resolves
# through and the template a consumer renders it with. The gate refuses a set
# where the oracle emits a reading this block does not declare, so a new
# result cannot appear in the verdict without also being displayable.
readings:
- id: mayor
  class: Citizen
  label: Mayor
  template: "{label}"
- id: mayorVotes
  class: null
  label: Votes for the mayor
  template: "{value} votes"
# Absent until this cycle is counted: "not yet determined" and "determined,
# and it failed" are different facts, and only one of them is in the verdict.
- id: quorumHeld
  class: null
  label: Quorum held
  template: "quorum {value}"
